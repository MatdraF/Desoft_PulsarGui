name: CI PulsarGUI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install Qt system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libgl1-mesa-dev libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest astropy PyQt6 matplotlib pint-pulsar

    - name: Run tests with pytest
      env:
        PYTHONPATH: src
        QT_QPA_PLATFORM: offscreen
      run: |
        pytest tests/