[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "desoft-pulsargui"
version = "0.2.0"
description = "Graphical interface for the initial processing and analysis of pulsar data"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "astropy",
    "matplotlib",
    "numpy",
    "PyQt6",
    "pint-pulsar",
]

[project.optional-dependencies]
test = [
    "pytest",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["PulsarGUI"]

[tool.pytest.ini_options]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"